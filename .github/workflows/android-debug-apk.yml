name: UniversalTracker Android Debug APK
on:
  workflow_dispatch:
  push:
    branches: [main, android-v0008-ci]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '11'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK
        run: sdkmanager 'platforms;android-29' 'build-tools;30.0.1' 'platform-tools'
      - name: Import V0008 source ZIP when project is missing
        if: ${{ hashFiles('gradlew') == '' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          ASSET='UniversalTracker_Android_V0008_GitHubActions_FullSource_ModifiedSource.zip'
          echo 'Android project absent; fetching release android-v0008-source'
          mkdir -p "$RUNNER_TEMP/ut-source"
          gh release download android-v0008-source -R "$GITHUB_REPOSITORY" --pattern "$ASSET" --dir "$RUNNER_TEMP/ut-source"
          unzip -q "$RUNNER_TEMP/ut-source/$ASSET" 'FullSource/AndroidProject/*' -d "$RUNNER_TEMP/ut-source/unpacked"
          cp -a "$RUNNER_TEMP/ut-source/unpacked/FullSource/AndroidProject/." .
      - name: Check Android project files
        run: |
          test -f ./gradlew
          test -f ./settings.gradle
          test -f ./app/build.gradle
      - name: Build debug APK
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon --stacktrace :app:assembleDebug
      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: UniversalTracker-Android-Debug-APK
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
      - name: Upload reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: android-build-reports
          path: |
            **/build/reports/**
            **/build/outputs/logs/**
          if-no-files-found: ignore
