name: UniversalTracker Android Debug APK
on:
  workflow_dispatch:
  push:
    branches: [main, android-v0008-ci]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '11'
      - uses: android-actions/setup-android@v3
      - run: sdkmanager 'platforms;android-29' 'build-tools;30.0.1' 'platform-tools'
      - name: Check Android project availability
        run: |
          test -f ./gradlew || { echo "::error::Android source has not been imported yet."; exit 1; }
          test -f ./app/build.gradle
      - name: Build debug APK
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon --stacktrace :app:assembleDebug
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: UniversalTracker-Android-Debug-APK
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
